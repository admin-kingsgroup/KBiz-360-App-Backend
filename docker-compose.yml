# Local dev infra for the KBiz360 backend. Postgres + Redis only.
# Usage: docker compose up -d   then   npm run prisma:migrate && npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: kb360-postgres
    environment:
      POSTGRES_USER: kb360
      POSTGRES_PASSWORD: kb360
      POSTGRES_DB: kb360
    ports:
      - "5432:5432"
    volumes:
      - kb360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb360"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kb360-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kb360_pgdata:
