name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # `npm test` needs live MongoDB Atlas (CRM) + Postgres/Redis — enable with a MONGODB_URI
      # secret + service containers (the chat realtime test self-skips without Mongo).

