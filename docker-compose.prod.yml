# KBiz360 backend — PRODUCTION (EC2). The Mongo backend uses MongoDB Atlas, so no DB container here.
# Deploy:  docker compose -f docker-compose.prod.yml up -d --build
# Env/secrets come from ./.env.production (copy .env.production.example) and ./secrets/.
services:
  backend:
    build: .
    image: kb360-backend
    container_name: kb360
    restart: unless-stopped
    env_file: ./.env.production
    ports:
      - "4000:4000"          # HTTP. Add a domain + Caddy for HTTPS (see DEPLOY_EC2.md "Going HTTPS").
    volumes:
      - ./uploads:/app/uploads
      # Firebase service account for the native call screen (optional — omit if unused):
      # - ./secrets/firebase.json:/app/secrets/firebase.json:ro

  # ── HTTPS: enable once a domain (e.g. api.kbiz360.com) points at this instance ──
