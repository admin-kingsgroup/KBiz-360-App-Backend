# KBiz360 backend — PRODUCTION (EC2). MongoDB Atlas is external, so no DB container here.
# Deploy:  docker compose -f docker-compose.prod.yml up -d --build
# Caddy terminates HTTPS (auto Let's Encrypt) for kbiz360.duckdns.org and proxies to the backend.
services:
  backend:
    build: .
    image: kb360-backend
    container_name: kb360
    restart: unless-stopped
    env_file: ./.env.production
    expose:
      - "4000"               # internal only — reached by Caddy on the compose network
    ports:
      - "4000:4000"          # also published on the host (HTTP fallback/debug; safe to remove later)
    volumes:
      - ./uploads:/app/uploads
      - ./secrets/firebase.json:/app/secrets/firebase.json:ro

  caddy:
    image: caddy:2-alpine
    container_name: kb360-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
